name: Reproduce manuscript analyses

on:
  workflow_dispatch:
  push:
    paths:
      - 'code/**'
      - 'data/**'
      - 'output/manuscript/**'
      - 'run_replication.R'
      - '.github/workflows/replication.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Run replication and concordance test
        run: Rscript --vanilla run_replication.R

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replication-output
          path: output/
